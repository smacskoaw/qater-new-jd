<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة | قطر واحة</title>
<style>
  :root{--bg:#f7e8ef;--purple:#7a1f5c;--dark:#5a1544;--white:#fff;--border:#e5cddd;--text:#2f2630;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Tahoma","Segoe UI",Arial,sans-serif}
  .page{width:min(1400px,100%);margin:auto;padding:24px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
  h1{margin:0;color:var(--dark);font-size:28px}
  button{border:0;border-radius:10px;padding:11px 18px;background:var(--purple);color:#fff;cursor:pointer;font:inherit}
  button:hover{background:var(--dark)}
  button.secondary{background:#fff;color:var(--dark);border:1px solid var(--border)}
  .panel{background:var(--white);border-radius:14px;padding:24px;box-shadow:0 2px 10px #5a154414}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .count{color:#6b5c67;font-size:14px}
  .table-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:1050px}
  th,td{padding:13px 10px;border-bottom:1px solid #f0e4ed;text-align:right;vertical-align:top;font-size:13px}
  th{color:var(--dark);background:#fff8fb;white-space:nowrap}
  td strong{display:block;color:var(--dark);margin-bottom:4px}
  .status{display:inline-block;padding:5px 8px;border-radius:20px;background:#f8e4ef;color:var(--dark);white-space:nowrap}
  .empty{text-align:center;color:#766773;padding:40px}
  @media(max-width:600px){.page{padding:16px}.topbar{align-items:flex-start;flex-direction:column}.panel{padding:18px}}
</style>
</head>
<body>
  <main class="page dashboard visible" id="dashboard">
    <div class="topbar"><h1>طلبات العملاء</h1><button class="secondary" id="refresh-button" type="button">تحديث</button></div>
    <section class="panel">
      <div class="toolbar"><span class="count" id="orders-count">عدد الطلبات: 0</span></div>
      <div class="table-wrap"><table><thead><tr><th>اسم الطلب</th><th>رقم الهاتف الثاني</th><th>تاريخ الشهر والسنة</th><th>رقم الطلب</th><th>رقم الطلب الأخير</th></tr></thead><tbody id="orders-body"><tr><td class="empty" colspan="5">لا توجد طلبات.</td></tr></tbody></table></div>
    </section>
  </main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-api.js"></script>
<script>
  const ordersBody = document.querySelector('#orders-body');
  const ordersCount = document.querySelector('#orders-count');

  function escapeHtml(value){
    return String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
  }

  function formatDate(value){
    if(!value) return '-';
    return new Date(value).toLocaleString('ar-QA');
  }

  async function loadOrders(){
    const snapshot = await firebaseStore.collection('orders').orderBy('createdAt', 'desc').get();
    const orders = snapshot.docs.map(document => document.data());
    ordersCount.textContent = `عدد الطلبات: ${orders.length}`;
    if(!orders.length){
      ordersBody.innerHTML = '<tr><td class="empty" colspan="5">لا توجد طلبات.</td></tr>';
      return;
    }
    ordersBody.innerHTML = orders.map(order => `<tr>
      <td>${escapeHtml(order.nameSecond || '-')}</td>
      <td>${escapeHtml(order.phoneSecond || '-')}</td>
      <td>${order.deliveryMonth && order.deliveryYear ? `${escapeHtml(order.deliveryMonth)}/${escapeHtml(order.deliveryYear)}` : '-'}</td>
      <td>${escapeHtml(order.orderNumber || '-')}</td>
      <td>${escapeHtml(order.confirmationNumberFinal || '-')}</td>
    </tr>`).join('');
  }

  loadOrders().catch(error => {
    ordersBody.innerHTML = `<tr><td class="empty" colspan="5">تعذر تحميل البيانات: ${escapeHtml(error.message)}</td></tr>`;
  });
  document.querySelector('#refresh-button').addEventListener('click', () => loadOrders());
</script>
</body>
</html>
